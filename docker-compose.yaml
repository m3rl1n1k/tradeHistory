services:
  php:
    restart: always
    container_name: php_${PROJECT_NAME}
    build:
      context: ./
      dockerfile: docker/configs/php/Dockerfile
      args:
        WORKDIR: ${WORKDIR}
    environment:
      WORKDIR: ${WORKDIR}
      PHP_IDE_CONFIG: serverName=tradeHistory
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./:${WORKDIR}
    networks:
      - tradeHistory

  postgres:
    restart: always
    image: postgres:16
    container_name: postgres_${PROJECT_NAME}
    ports:
      - ${POSTGRES_PORT}:5432
    environment:
      POSTGRES_ROOT_PASSWORD: ${POSTGRES_ROOT_PASSWORD:-rootpass}
      POSTGRES_DB: ${POSTGRES_DB:-project_db}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - database:/var/lib/postgresql/data
    networks:
      - tradeHistory

  nginx:
    restart: always
    image: nginx:latest
    container_name: nginx_${PROJECT_NAME}
    environment:
      WORKDIR: ${WORKDIR}
      HTTP_PORT: ${HTTP_PORT}
      HTTPS_PORT: ${HTTPS_PORT}
    ports:
      - ${HTTP_PORT}:80
      - ${HTTPS_PORT}:443
    volumes:
      - ./:${WORKDIR}
      - ./docker/configs/nginx:/etc/nginx/conf.d
      - ./docker/configs/nginx/project.conf.template:/etc/nginx/templates/project.conf.template
      - ./logs/nginx:/var/log/nginx
      - ./logs/cache:/var/cache/nginx
      - ./ssl:/etc/ssl/private
    networks:
      - tradeHistory
        #certbot:
        #image: certbot/certbot
        #volumes:
        #- ./ssl:/etc/letsencrypt
        #- ./docker/configs/nginx:/etc/nginx/conf.d
        #entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"  

volumes:
  database:

networks:
  tradeHistory:
    driver: bridge
